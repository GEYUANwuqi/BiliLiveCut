server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 50g;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;

    location ~ ^/(api(?:/|$)|auth(?:/|$)|review/api(?:/|$)|collection/api(?:/|$)|openapi\.json$) {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
    }
    location = /media-auth.js {
        add_header Cache-Control no-store;
        add_header Service-Worker-Allowed /;
    }
    location / {
        try_files $uri $uri/ @spa;
        add_header Cache-Control no-store;
    }
    location @spa {
        # 仅前端路由回退，缺失资源与未知 API 不返回 HTML。
        if ($uri !~ "^/(rooms|recording|imports|schedules|transcripts|danmaku|sessions|topics|clips|uploads|trends|tasks|analytics|monitor|logs|settings(/(configuration|automation|llm|login|plugins|subtitles|intros|notifications))?|review(/(queue|[0-9]+))?|collection/[0-9]+|plugins/[^/]+/settings)?/?$") { return 404; }
        rewrite ^ /index.html last;
    }
}
